version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: zeno_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  bid-engine:
    build: .
    container_name: bid_engine_oaas
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/bid_engine.db
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "src/main.py", "--cron", "0 */4 * * *"]

volumes:
  redis_data:
